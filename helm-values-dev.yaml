projectName: sparrowx
environment: dev

serviceName: backstage-pyactions

replicaCount: 1

appPort: 8000
# extraAnnotations:
# extraLabels:

resources:
  size: medium

servicemonitor:
  enabled: true

probePath: /
livenessProbe:
  enabled: true
readinessProbe:
  enabled: true
startupProbe:
  enabled: true

container:
  env:
    - name: APP_NAME
      value: Backstage-PyActions
    - name: APP_PORT
      value: "8000"
    - name: DEBUG
      value: "false"
    - name: GIT_PROVIDER
      value: github
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-pyactions-secrets
          key: GITHUB_TOKEN

