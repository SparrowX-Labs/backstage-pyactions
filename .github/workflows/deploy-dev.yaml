name: Automated Deployment to Development

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  argosync-candidate:
    name: argosync-candidate
    uses: SparrowX-Labs/workflows-templates/.github/workflows/argosync.yaml@v2.0.0
    with:
      environment: dev
      env-params-file: helm-values-dev.yaml
      image-tag: "dev-candidate"
    secrets:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  # Can't Run Smoke tests for now, because service isn't exposed publicaly, and pipeline is run on public runner
  # Run smoke tests against the deployed service.
  # smoke-test:
  #   name: Smoke Test Development
  #   needs: argosync-candidate
  #   uses: SparrowX-Labs/workflows-templates/.github/workflows/smoke-test.yaml@v2.0.0
  #   with:
  #     base-url: ${{ vars.DEV_BASE_URL }}
  #     health-path: ${{ vars.HEALTH_CHECK_PATH }}
  #     timeout: '120'

  # #Promote Image to Dev Deployed, Only if dev quality gate is passed
  promote-image:
    name: Promote Image
    needs: smoke-test
    uses: SparrowX-Labs/workflows-templates/.github/workflows/promote-image.yaml@v2.0.0
    with:
      env-params-file: helm-values-dev.yaml
      origin-image-tag: "dev-candidate"
      new-image-tag: "dev-deployed"

  # #Update deployment to reflect the successful promotion status
  argosync-deployed:
    name: argosync-deployed
    needs: promote-image
    uses: SparrowX-Labs/workflows-templates/.github/workflows/argosync.yaml@v2.0.0
    with:
      environment: dev
      env-params-file: helm-values-dev.yaml
      image-tag: "dev-deployed"
    secrets:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
