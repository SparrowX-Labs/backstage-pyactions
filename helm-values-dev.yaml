projectName: sparrowx
environment: dev

serviceName: backstage-pyactions

replicaCount: 1

appPort: 8000
# extraAnnotations:
# extraLabels:

resources:
  size: medium

servicemonitor:
  enabled: true

probePath: /
livenessProbe:
  enabled: true
readinessProbe:
  enabled: true
startupProbe:
  enabled: true


